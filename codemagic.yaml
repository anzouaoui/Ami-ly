workflows:
  ios-workflow:
    name: Ami-ly iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # [MODIFIE] Import explicite des groupes de variables/secrets definis dans
      # l'UI Codemagic (Settings > Environment variables). SANS ce champ "groups",
      # les secrets ne sont PAS injectes dans le build -> codemagic.env vide.
      # >>> Adapter ces noms aux groupes reels de votre projet Codemagic <<<
      groups:
        - firebase_credentials
        - payments_credentials
        - agora_credentials
      vars:
        BUNDLE_ID: "com.app.amily"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      xcode: latest
      cocoapods: default
      flutter: stable
    scripts:
      # [MODIFIE] Etape pre-build dediee : genere codemagic.env AVANT tout le reste
      - name: Generate codemagic.env (dart defines)
        script: |
          set -euo pipefail
          # Securite : echec immediate si CM_BUILD_DIR est absent, puis cd absolu
          : "${CM_BUILD_DIR:?CM_BUILD_DIR n'est pas defini}"
          cd "$CM_BUILD_DIR"
          ENV_FILE="$CM_BUILD_DIR/codemagic.env"

          # Variables obligatoires (doivent venir des groupes declares ci-dessus)
          REQUIRED_VARS="FIREBASE_API_KEY_ANDROID FIREBASE_APP_ID_ANDROID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_API_KEY_IOS FIREBASE_APP_ID_IOS STRIPE_PUBLISHABLE_KEY AGORA_APP_ID"

          # Verifie chaque secret AVANT generation : message clair si groupe mal reference
          MISSING=0
          for VAR in $REQUIRED_VARS; do
            if [ -z "$(printenv "$VAR" || true)" ]; then
              echo "ERREUR: $VAR absente de l'environnement (verifier le champ 'groups' ou le groupe Codemagic)"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

          # Generation : secrets filtres par prefixe + suppression des \r pour un .env propre
          rm -f "$ENV_FILE"
          env | grep -E '^(FIREBASE_|STRIPE_PUBLISHABLE_KEY|REVENUECAT_|AGORA_)' | tr -d '\r' >> "$ENV_FILE" || true

          # Controles renforces : fichier non vide ET chaque variable requise presente
          if [ ! -s "$ENV_FILE" ]; then
            echo "ERREUR: $ENV_FILE vide - aucune variable capturee depuis les groupes"
            exit 1
          fi
          for VAR in $REQUIRED_VARS; do
            grep -q "^${VAR}=" "$ENV_FILE" || { echo "ERREUR: $VAR manquante dans $ENV_FILE"; exit 1; }
          done

          # Diagnostic : noms uniquement, jamais les valeurs (secrets)
          echo "codemagic.env genere ($(wc -l < "$ENV_FILE") entrees) : $(cut -d= -f1 "$ENV_FILE" | tr '\n' ' ')"

      # [MODIFIE] Chemin absolu base sur $CM_BUILD_DIR au lieu du relatif "."
      - name: Install pods
        script: |
          set -e
          find "$CM_BUILD_DIR" -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Flutter build ipa
        script: |
          set -euo pipefail
          # [MODIFIE] Build execute depuis la racine ABSOLUE du projet :
          # corrige "Did not find the file passed to --dart-define-from-file"
          cd "$CM_BUILD_DIR"
          ENV_FILE="$CM_BUILD_DIR/codemagic.env"

          # Garde-fou : le fichier genere en pre-build doit exister ici
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERREUR: $ENV_FILE introuvable. Contenu de $CM_BUILD_DIR :"
            ls -la "$CM_BUILD_DIR"
            exit 1
          fi

          flutter build ipa --release \
            --dart-define-from-file="$ENV_FILE" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - anouk.zouaoui@anoukzouaoui.fr
