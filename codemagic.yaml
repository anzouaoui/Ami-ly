workflows:
  ios-workflow:
    name: Ami-ly iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # [AJOUTE] Requis par publishing -> app_store_connect -> auth: integration
      # Remplacer par le nom EXACT de votre integration App Store Connect,
      # visible dans Codemagic UI > Teams > Integrations > App Store Connect
      app_store_connect: bricapattes-appstore
    environment:
      # [MODIFIE] Import explicite des groupes de variables/secrets definis dans
      # l'UI Codemagic (Settings > Environment variables). SANS ce champ "groups",
      # les secrets ne sont PAS injectes dans le build -> codemagic.env vide.
      # >>> Adapter ces noms aux groupes reels de votre projet Codemagic <
      groups:
        - firebase_credentials
        - payments_credentials
        - agora_credentials
      vars:
        BUNDLE_ID: "com.app.amily"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      xcode: latest
      cocoapods: default
      flutter: stable
    scripts:
      # [MODIFIE] Etape pre-build dediee : genere codemagic.env AVANT tout le reste
      # CORRECTION fix/codemagic-env-dart-defines-syntax-error :
      #   Le script inline precedent utilisait "$(printenv "$VAR" || true)" avec des
      #   guillemets imbriques qui cassaient le parsing POSIX sh (ligne ~50 du script
      #   genere par Codemagic : "syntax error near unexpected token '('").
      #   Solution : appel explicite a bash + script versionne codemagic/generate_env.sh
      #   qui utilise l expansion indirecte bash ${!VAR} (sans sous-shell imbrique).
      #   Verification syntaxique locale : bash -n codemagic/generate_env.sh
      - name: Generate codemagic.env (dart defines)
        script: |
          bash "$CM_BUILD_DIR/codemagic/generate_env.sh"

      # [MODIFIE] Chemin absolu base sur $CM_BUILD_DIR au lieu du relatif "."
      - name: Install pods
        script: |
          set -e
          find "$CM_BUILD_DIR" -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Flutter build ipa
        script: |
          set -euo pipefail
          # [MODIFIE] Build execute depuis la racine ABSOLUE du projet :
          # corrige "Did not find the file passed to --dart-define-from-file"
          cd "$CM_BUILD_DIR"
          ENV_FILE="$CM_BUILD_DIR/codemagic.env"

          # Garde-fou : le fichier genere en pre-build doit exister ici
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERREUR: $ENV_FILE introuvable. Contenu de $CM_BUILD_DIR :"
            ls -la "$CM_BUILD_DIR"
            exit 1
          fi

          flutter build ipa --release \
            --dart-define-from-file="$ENV_FILE" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - anouk.zouaoui@anoukzouaoui.fr